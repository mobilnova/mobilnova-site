<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden — Mobilnova</title>
<style>
  :root{--bg:#e9f1f8;--ink:#0c1a24;--muted:#4c6273;--accent:#0e6f95;--grad:linear-gradient(135deg,#1aa6c9,#0e6f95);
    --sans:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:
    radial-gradient(50% 40% at 80% 0%,rgba(31,179,216,.18),transparent 60%),var(--bg);
    color:var(--ink);font-family:var(--sans);text-align:center;padding:2rem}
  .mark{width:3rem;height:3rem;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;
    font-size:1.4rem;background:var(--grad);margin:0 auto 1.3rem;box-shadow:0 10px 24px rgba(14,111,149,.32)}
  h1{font-size:1.8rem;letter-spacing:-.02em;margin:0 0 .5rem}
  p{color:var(--muted);margin:0 0 1.6rem}
  a.btn{display:inline-block;color:#fff;background:var(--grad);text-decoration:none;font-weight:700;
    border-radius:11px;padding:.8rem 1.5rem;box-shadow:0 8px 20px rgba(14,111,149,.3)}
</style>
</head>
<body>
  <div>
    <div class="mark">M</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Vielleicht ein alter Link. Zurück zur Mobilnova-Startseite:</p>
    <a class="btn" href="/">Zur Startseite →</a>
  </div>
</body>
</html>
